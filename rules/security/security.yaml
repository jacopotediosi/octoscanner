# OctoPrint security rules

# Shared by every XSS rule below. Matches the values that are provably safe.
_safe_expression: &safe_expression |-
  (?x)
  \A \s* (?&expr) \s* \z
  (?(DEFINE)
    # A safe expression: safe atoms joined by `+`
    (?<expr>       (?&atom) (?: \s* \+ \s* (?&atom) )* )
    (?<atom>       (?&str) | (?&escaper) | (?&translator) | (?&formatter) | (?&array)
                 | \( \s* (?&expr) \s* \) )
    # String literals. Semgrep truncates a template literal right after its first
    # interpolation, hence the optional trailing `}` and backtick.
    (?<str>        " (?: [^"\\] | \\. )* "
                 | ' (?: [^'\\] | \\. )* '
                 | ` (?: [^`\\$] | \\. | \$ (?!\{) | \$\{ \s* (?&expr) \s* \}? )* `? )
    # Escaping/sanitizing calls, safe whatever their arguments are
    (?<escaper>    (?: [\w$]+ \s* \. \s* )* (?: escape | sanitize ) \w* \s* (?&args) )
    # Translation calls, safe only as long as their arguments are safe too
    (?<translator> (?: [\w$]+ \s* \. \s* )* (?: n?gettext | _ ) \s*
                   \( \s* (?&expr) (?: \s* , \s* (?: (?&expr) | [\w$.]+ ) )* \s* ,? \s* \) )
    # `sprintf` calls, safe as long as the format and every substituted value are
    (?<formatter>  (?: [\w$]+ \s* \. \s* )* v?sprintf \s* \(
                   \s* (?&expr) (?: \s* , \s* (?&farg) )* \s* ,? \s* \) )
    (?<farg>       (?&expr) | (?&obj) )
    (?<obj>        \{ \s* (?: (?&pair) (?: \s* , \s* (?&pair) )* \s* ,? )? \s* \} )
    (?<pair>       (?: [\w$]+ | (?&str) ) \s* : \s* (?&farg) )
    # Arrays whose items are all safe expressions
    (?<array>      \[ \s* (?: (?&expr) (?: \s* , \s* (?&expr) )* \s* ,? )? \s* \] )
    # Balanced parentheses, any depth, with strings left alone
    (?<args>       \( (?: [^()"'`] | (?&str) | (?&args) )* \) )
  )

rules:
  - id: SEC-0001
    message: >
      Plugin implements `SimpleApiPlugin` but does not override `is_api_protected()`.
      Until OctoPrint 2.1.0, the default implementation returns `False`, allowing
      unauthenticated access to `SimpleApi` endpoints.
    languages: [python]
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: |
              class $CLASS(..., octoprint.plugin.SimpleApiPlugin, ...):
                  ...
          - pattern: |
              class $CLASS(..., SimpleApiPlugin, ...):
                  ...
      - pattern-not: |
          class $CLASS(...):
              ...
              def is_api_protected(self, ...):
                  ...
              ...
    metadata:
      type: security
      since: 1.11.2
      suggestion: >
        Override `is_api_protected()` to explicitly return `True`. Note that this only
        controls authentication; you should also verify permissions explicitly in
        each API handler (e.g. `Permissions.PLUGIN_MYPLUGIN_ACCESS`).
  - id: SEC-0002
    message: >
      Plugin implements `is_api_protected()` but explicitly returns `False`, leaving
      `SimpleApi` endpoints accessible without authentication.
    languages: [python]
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: |
              class $CLASS(..., octoprint.plugin.SimpleApiPlugin, ...):
                  ...
                  def is_api_protected(self, ...):
                      ...
                      return False
                  ...
          - pattern: |
              class $CLASS(..., SimpleApiPlugin, ...):
                  ...
                  def is_api_protected(self, ...):
                      ...
                      return False
                  ...
    metadata:
      type: security
      since: 1.11.2
      suggestion: >
        Ensure this is intentional. Consider returning `True` and adding explicit
        permission checks in each API handler.
  - id: SEC-0003
