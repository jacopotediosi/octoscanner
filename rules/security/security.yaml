  - id: SEC-0016
    message: >
      `showConfirmationDialog()` invocation passing a non-literal value as `html`.
      The `html` option replaces the whole dialog body and is handed to jQuery as
      raw markup, so any attacker-controllable data flowing into it results in DOM
      XSS.
    languages: [js]
    severity: WARNING
    patterns:
      # Match both documented call forms, `showConfirmationDialog(options)` and
      # `showConfirmationDialog(message, onacknowledge, options)`.
      - pattern-either:
          - pattern: "showConfirmationDialog({..., html: $X, ...})"
          - pattern: "showConfirmationDialog($MSG, $ONACK, {..., html: $X, ...})"
          - pattern: "window.showConfirmationDialog({..., html: $X, ...})"
          - pattern: "window.showConfirmationDialog($MSG, $ONACK, {..., html: $X, ...})"
      - metavariable-pattern:
          metavariable: $X
          patterns:
            # Exclude string literals, taking advantage of Semgrep's AST
            # constant propagation.
            - pattern-not: '"..."'
            - pattern-not: "'...'"
            # Exclude expressions made exclusively of safe atoms: string literals,
            # escaping/sanitizing calls, translation calls whose own arguments are
            # safe, and arrays of those. Anything else (bare identifier, property
            # access, unknown call, translated concatenation, template literal
            # interpolating an unescaped value, ...) trips it.
            - pattern-not-regex: *safe_expression
    metadata:
      type: security
      suggestion: >
        The `html` option is inserted as-is by design, so the markup must already be
        safe when it is passed: wrap every user-controllable substring in
        `_.escape(...)` before interpolating it.
