  - id: SEC-0013
    message: >
      `showConfirmationDialog()` invocation passing a non-literal value as `title`.
      OctoPrint concatenates `title` into the dialog header markup and hands the
      result to jQuery, so it is rendered as raw HTML and any attacker-controllable
      data flowing into it results in DOM XSS.
    languages: [js]
    severity: WARNING
    patterns:
      # Match both documented call forms, `showConfirmationDialog(options)` and
      # `showConfirmationDialog(message, onacknowledge, options)`.
      - pattern-either:
          - pattern: "showConfirmationDialog({..., title: $X, ...})"
          - pattern: "showConfirmationDialog($MSG, $ONACK, {..., title: $X, ...})"
          - pattern: "window.showConfirmationDialog({..., title: $X, ...})"
          - pattern: "window.showConfirmationDialog($MSG, $ONACK, {..., title: $X, ...})"
      - metavariable-pattern:
          metavariable: $X
          patterns:
            # Exclude string literals, taking advantage of Semgrep's AST
            # constant propagation.
            - pattern-not: '"..."'
            - pattern-not: "'...'"
            # Exclude expressions made exclusively of safe atoms: string literals,
            # escaping/sanitizing calls, translation calls whose own arguments are
            # safe, and arrays of those. Anything else (bare identifier, property
            # access, unknown call, translated concatenation, template literal
            # interpolating an unescaped value, ...) trips it.
            - pattern-not-regex: *safe_expression
    metadata:
      type: security
      suggestion: >
        The helper offers no escaping option, so the value must already be safe when
        it is passed: wrap it in `_.escape(...)`, and escape every user-controllable
        substring before interpolating it into markup.
  - id: SEC-0014
    message: >
      `showConfirmationDialog()` invocation passing a non-literal value as `message`,
      either as the `message` option or as the first positional argument. OctoPrint
      concatenates it into the dialog body markup and hands the result to jQuery, so
      it is rendered as raw HTML and any attacker-controllable data flowing into it
      results in DOM XSS.
    languages: [js]
    severity: WARNING
    patterns:
      # Match both documented call forms, `showConfirmationDialog(options)` and
      # `showConfirmationDialog(message, onacknowledge, options)`.
      - pattern-either:
          - pattern: "showConfirmationDialog({..., message: $X, ...})"
          - pattern: "showConfirmationDialog($MSG, $ONACK, {..., message: $X, ...})"
          - pattern: "window.showConfirmationDialog({..., message: $X, ...})"
          - pattern: "window.showConfirmationDialog($MSG, $ONACK, {..., message: $X, ...})"
          - pattern: "showConfirmationDialog($X, ...)"
          - pattern: "window.showConfirmationDialog($X, ...)"
      - metavariable-pattern:
          metavariable: $X
          patterns:
            # Exclude the options object itself, matched by the alternatives above.
            - pattern-not: "{...}"
            # Exclude string literals, taking advantage of Semgrep's AST
            # constant propagation.
            - pattern-not: '"..."'
            - pattern-not: "'...'"
            # Exclude expressions made exclusively of safe atoms: string literals,
            # escaping/sanitizing calls, translation calls whose own arguments are
            # safe, and arrays of those. Anything else (bare identifier, property
            # access, unknown call, translated concatenation, template literal
            # interpolating an unescaped value, ...) trips it.
            - pattern-not-regex: *safe_expression
    metadata:
      type: security
      suggestion: >
        The helper offers no escaping option, so the value must already be safe when
        it is passed: wrap it in `_.escape(...)`, and escape every user-controllable
        substring before interpolating it into markup.
