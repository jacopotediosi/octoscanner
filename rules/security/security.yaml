  - id: SEC-0009
    message: >
      Knockout `html:` binding bound to a non-literal value in a Jinja/HTML
      template. The bound expression is rendered as raw HTML, so any
      attacker-controllable data flowing into it results in DOM XSS.
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "*.jinja2"
        - "*.html"
    patterns:
      # Match the `data-bind` attribute down to the value of its top-level `html:`
      # binding, and capture that value so that the `metavariable-pattern` below can
      # inspect it on its own.
      - pattern-regex: |-
          (?x)
          # Atomic skips: a quoted string consumed one character at a time blows up the scan.
          data-bind \s* = \s* (?<Q> ["'] )
          (?> (?! \k<Q> ) (?: (?&str) | (?&group) | [\s\S] ) )*?
          (?<! [-\w$.] ) html \s* : \s*
          (?<VALUE> (?> (?! \k<Q> ) (?: (?&str) | (?&group) | [^,] ) )+ )
          (?(DEFINE)
            # Kept single-line, so that they cannot swallow the closing quote
            (?<str>    ' (?: [^'\\\n] | \\. )* ' | " (?: [^"\\\n] | \\. )* " )
            # Anything that neither opens a group nor starts a string
            (?<plain>  [^{}\[\]()'"] )
            # Bracketed groups, unrolled to four levels: unbounded recursion lets a run
            # of stray braces exhaust the PCRE limits and void the whole file silently.
            (?<group>  [{\[(] (?: (?&plain) | (?&str) | (?&group2) )* [)\]}] )
            (?<group2> [{\[(] (?: (?&plain) | (?&str) | (?&group3) )* [)\]}] )
            (?<group3> [{\[(] (?: (?&plain) | (?&str) | (?&group4) )* [)\]}] )
            (?<group4> [{\[(] (?: (?&plain) | (?&str) )* [)\]}] )
          )
      - metavariable-pattern:
          metavariable: $VALUE
          language: generic
          patterns:
            # Exclude expressions made exclusively of safe atoms: string literals,
            # escaping/sanitizing calls, translation calls whose own arguments are
            # safe, and arrays of those. Anything else (bare identifier, property
            # access, observable, unknown call, ...) trips it.
            - pattern-not-regex: *safe_expression
            # Exclude the Bootstrap popover `html` sub-option, for the rare attribute
            # whose nesting runs deeper than the skip above can follow.
            - pattern-not-regex: '\A\s*(true|false)\s*\z'
            # Exclude values that route through an escaping/sanitizing call even when
            # its result is wrapped further, e.g. `highlight(escape(key))`.
            - pattern-not-regex: '\b(escape|sanitize)\w*\s*\('
    metadata:
      type: security
      suggestion: >
        Prefer the Knockout `text:` binding, which renders the value as plain
        text and is safe by default. Use `html:` only when raw HTML output is
        strictly required, and only with values that are either fully static
        or that have been properly sanitized.
  - id: SEC-0010
    message: >
      HTTP route registered with an OctoPrint-shipped handler that supports an
      `access_validation` kwarg, but no `access_validation` is passed. Routes
      registered this way (e.g. via the `octoprint.server.http.routes` hook)
      have no authentication and no CSRF protection by default, so any client
      - including unauthenticated remote attackers - can reach the handler.
    languages: [python]
    severity: CRITICAL
    patterns:
      # Anchor on a route tuple `(path, HandlerClass, kwargs)` whose handler is
      # one of the OctoPrint-shipped handlers that natively support an
      # `access_validation` kwarg (see `octoprint.server.util.tornado`).
      - pattern-either:
          - pattern: ($P, LargeResponseHandler, $K)
          - pattern: ($P, UrlProxyHandler, $K)
          - pattern: ($P, UrlForwardHandler, $K)
          - pattern: ($P, StaticDataHandler, $K)
          - pattern: ($P, GeneratingDataHandler, $K)
          - pattern: ($P, WebcamSnapshotHandler, $K)
          - pattern: ($P, DeprecatedEndpointHandler, $K)
          - pattern: ($P, StaticZipBundleHandler, $K)
          - pattern: ($P, DynamicZipBundleHandler, $K)
          - pattern: ($P, SystemInfoBundleHandler, $K)
      # Exclude routes that already pass an `access_validation` handler kwarg,
      # in either dict-literal or `dict(...)` form.
      - metavariable-pattern:
          metavariable: $K
          patterns:
            - pattern-not: |
                {..., "access_validation": ..., ...}
            - pattern-not: |
                dict(..., access_validation=..., ...)
    metadata:
      type: security
      since: 1.2.0
      suggestion: >
        Pass an `access_validation` callable in the handler kwargs, typically
        built via `octoprint.server.util.tornado.access_validation_factory(app,
        validator, *permissions)` with a validator from
        `octoprint.server.util.flask` (e.g. `permission_validator` or
        `permission_and_fresh_credentials_validator`). If the route is
        intentionally public (e.g. serving static plugin assets), document the
        decision explicitly.
  - id: SEC-0011
    message: >
      `PNotify` invocation passing a non-literal value as `text` without
      `text_escape: true`. PNotify v2 (the version shipped with OctoPrint)
      renders `text` as raw HTML by default, so any attacker-controllable data
      flowing into it (push messages, backend errors, printer responses, etc.)
      results in DOM XSS.
    languages: [js]
    severity: WARNING
    patterns:
      - pattern: "new PNotify({..., text: $X, ...})"
      - pattern-not: "new PNotify({..., text_escape: true, ...})"
      - metavariable-pattern:
          metavariable: $X
          patterns:
            # Exclude string literals, taking advantage of Semgrep's AST
            # constant propagation.
            - pattern-not: '"..."'
            - pattern-not: "'...'"
            # Exclude expressions made exclusively of safe atoms: string
            # literals, escaping/sanitizing calls, translation calls whose own
            # arguments are safe, and arrays of those. Anything else (bare
            # identifier, property access, unknown call, translated
            # concatenation, template literal interpolating an unescaped
            # value, ...) trips it.
            - pattern-not-regex: *safe_expression
    metadata:
      type: security
      suggestion: >
        Set `text_escape: true` in the PNotify options so the value is rendered
        as plain text. If the value must contain HTML, escape any
        user-controllable substring via `_.escape(...)` before
        interpolating it into the markup.
  - id: SEC-0012
    message: >
