# OctoPrint API security rules

rules:
  - id: SEC-API-0001
    message: >
      Plugin implements `SimpleApiPlugin` but does not override `is_api_protected()`.
      Until OctoPrint 2.1.0, the default implementation returns `False`, allowing
      unauthenticated access to `SimpleApi` endpoints.
    languages: [python]
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: |
              class $CLASS(..., octoprint.plugin.SimpleApiPlugin, ...):
                  ...
          - pattern: |
              class $CLASS(..., SimpleApiPlugin, ...):
                  ...
      - pattern-not: |
          class $CLASS(...):
              ...
              def is_api_protected(self, ...):
                  ...
              ...
    metadata:
      type: security
      since: 1.11.2
      suggestion: >
        Override `is_api_protected()` to explicitly return `True`. Note that this only
        controls authentication; you should also verify permissions explicitly in
        each API handler (e.g. `Permissions.PLUGIN_MYPLUGIN_ACCESS`).
  - id: SEC-API-0002
    message: >
      Plugin implements `is_api_protected()` but explicitly returns `False`, leaving
      `SimpleApi` endpoints accessible without authentication.
    languages: [python]
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: |
              class $CLASS(..., octoprint.plugin.SimpleApiPlugin, ...):
                  ...
                  def is_api_protected(self, ...):
                      ...
                      return False
                  ...
          - pattern: |
              class $CLASS(..., SimpleApiPlugin, ...):
                  ...
                  def is_api_protected(self, ...):
                      ...
                      return False
                  ...
    metadata:
      type: security
      since: 1.11.2
      suggestion: >
        Ensure this is intentional. Consider returning `True` and adding explicit
        permission checks in each API handler.
  - id: SEC-API-0003
    message: >
      Plugin implements `is_blueprint_protected()` but explicitly returns `False`,
      leaving the blueprint's dynamic endpoints accessible without authentication.
    languages: [python]
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: |
              class $CLASS(..., octoprint.plugin.BlueprintPlugin, ...):
                  ...
                  def is_blueprint_protected(self, ...):
                      ...
                      return False
                  ...
          - pattern: |
              class $CLASS(..., BlueprintPlugin, ...):
                  ...
                  def is_blueprint_protected(self, ...):
                      ...
                      return False
                  ...
    metadata:
      type: security
      since: 1.2.0
      suggestion: >
        Ensure this is intentional. Consider returning `True` and adding explicit
        permission checks in each endpoint handler (e.g. `Permissions.PLUGIN_MYPLUGIN_ACCESS`).
  - id: SEC-API-0004
    message: >
      Plugin implements `BlueprintPlugin` but does not override
      `is_blueprint_csrf_protected()`. Until OctoPrint 2.0.0, the default
      implementation returns `False`, leaving the blueprint's endpoints
      exposed to CSRF attacks.
    languages: [python]
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: |
              class $CLASS(..., octoprint.plugin.BlueprintPlugin, ...):
                  ...
          - pattern: |
              class $CLASS(..., BlueprintPlugin, ...):
                  ...
      - pattern-not: |
          class $CLASS(...):
              ...
              def is_blueprint_csrf_protected(self, ...):
                  ...
              ...
    metadata:
      type: security
      since: 1.8.3
      suggestion: >
        Override `is_blueprint_csrf_protected()` to return `True` and exempt only
        the endpoints that must not use CSRF protection via the
        `@octoprint.plugin.BlueprintPlugin.csrf_exempt()` decorator.
  - id: SEC-API-0005
    message: >
      Plugin implements `is_blueprint_csrf_protected()` but explicitly returns
      `False`, leaving the blueprint's endpoints exposed to CSRF attacks.
    languages: [python]
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: |
              class $CLASS(..., octoprint.plugin.BlueprintPlugin, ...):
                  ...
                  def is_blueprint_csrf_protected(self, ...):
                      ...
                      return False
                  ...
          - pattern: |
              class $CLASS(..., BlueprintPlugin, ...):
                  ...
                  def is_blueprint_csrf_protected(self, ...):
                      ...
                      return False
                  ...
    metadata:
      type: security
      since: 1.8.3
      suggestion: >
        Return `True` and exempt only the endpoints that genuinely cannot use CSRF
        protection via the `@octoprint.plugin.BlueprintPlugin.csrf_exempt()` decorator.
  - id: SEC-API-0006
    message: >
      Endpoint exempted from CSRF protection via `BlueprintPlugin.csrf_exempt()`.
      Ensure that the exemption is necessary and that the endpoint uses an
      alternative anti-CSRF mechanism (e.g. token in header).
    languages: [python]
    severity: CRITICAL
    pattern-either:
      - pattern: "@octoprint.plugin.BlueprintPlugin.csrf_exempt()"
      - pattern: "@BlueprintPlugin.csrf_exempt()"
    metadata:
      type: security
      since: 1.8.3
      suggestion: >
        Remove the decorator if not strictly required. Otherwise, document why
        the endpoint cannot use CSRF protection and ensure another anti-CSRF
        mechanism is in place.
  - id: SEC-API-0007
    message: >
      HTTP route registered with an OctoPrint-shipped handler that supports an
      `access_validation` kwarg, but no `access_validation` is passed. Routes
      registered this way (e.g. via the `octoprint.server.http.routes` hook)
      have no authentication and no CSRF protection by default, so any client
      - including unauthenticated remote attackers - can reach the handler.
    languages: [python]
    severity: CRITICAL
    patterns:
      # Anchor on a route tuple `(path, HandlerClass, kwargs)` whose handler is
      # one of the OctoPrint-shipped handlers that natively support an
      # `access_validation` kwarg (see `octoprint.server.util.tornado`).
      - pattern-either:
          - pattern: ($P, LargeResponseHandler, $K)
          - pattern: ($P, UrlProxyHandler, $K)
          - pattern: ($P, UrlForwardHandler, $K)
          - pattern: ($P, StaticDataHandler, $K)
          - pattern: ($P, GeneratingDataHandler, $K)
          - pattern: ($P, WebcamSnapshotHandler, $K)
          - pattern: ($P, DeprecatedEndpointHandler, $K)
          - pattern: ($P, StaticZipBundleHandler, $K)
          - pattern: ($P, DynamicZipBundleHandler, $K)
          - pattern: ($P, SystemInfoBundleHandler, $K)
      # Exclude routes that already pass an `access_validation` handler kwarg,
      # in either dict-literal or `dict(...)` form.
      - metavariable-pattern:
          metavariable: $K
          patterns:
            - pattern-not: |
                {..., "access_validation": ..., ...}
            - pattern-not: |
                dict(..., access_validation=..., ...)
    metadata:
      type: security
      since: 1.2.0
      suggestion: >
        Pass an `access_validation` callable in the handler kwargs, typically
        built via `octoprint.server.util.tornado.access_validation_factory(app,
        validator, *permissions)` with a validator from
        `octoprint.server.util.flask` (e.g. `permission_validator` or
        `permission_and_fresh_credentials_validator`). If the route is
        intentionally public (e.g. serving static plugin assets), document the
        decision explicitly.
