  - id: SEC-XSS-0012
    message: >
      Knockout `popover:` binding enabling `html` and binding `content` to a
      non-literal value. Bootstrap fills the popover body with `.html()` instead of
      `.text()` as soon as `html` is on, so any attacker-controllable data flowing
      into `content` results in DOM XSS.
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "*.jinja2"
        - "*.html"
    patterns:
      # Match the whole `popover: {...}` options object, but only when it enables
      # `html`, and capture the value bound to `content` so that the
      # `metavariable-pattern` below can inspect it on its own.
      - pattern-regex: |-
          (?x)
          # Atomic skips: a quoted string consumed one character at a time blows up the scan.
          (?<! [-\w$.] ) popover \s* : \s* \{
          (?= (?> (?&str) | \{ [^{}]* \} | [^{}] )*? (?<! [-\w$] ) ['"]? html ['"]? \s* : \s* true \b )
          (?> (?&str) | \{ [^{}]* \} | [^{}] )*? (?<! [-\w$] ) ['"]? content ['"]? \s* : \s*
          (?<VALUE> (?> (?&str) | (?&paren) | (?&brack) | [^,{}] )+ )
          (?> (?&str) | \{ [^{}]* \} | [^{}] )*? \}
          (?(DEFINE)
            # Kept single-line, so that they cannot swallow the object's closing brace
            (?<str>   " (?: [^"\\\n] | \\. )* " | ' (?: [^'\\\n] | \\. )* ' )
            (?<paren> \( (?: [^()"'] | (?&str) | (?&paren) )* \) )
            (?<brack> \[ (?: [^\[\]"'] | (?&str) | (?&brack) )* \] )
          )
      - metavariable-pattern:
          metavariable: $VALUE
          language: generic
          patterns:
            # Exclude expressions made exclusively of safe atoms: string literals,
            # escaping/sanitizing calls, translation calls whose own arguments are
            # safe, and arrays of those. Anything else (bare identifier, property
            # access, observable, unknown call, ...) trips it.
            - pattern-not-regex: *safe_expression
    metadata:
      type: security
      suggestion: >
        Drop `html: true` so Bootstrap renders the popover body as plain text. If the
        body must contain markup, escape every user-controllable substring via
        `_.escape(...)` before interpolating it into the markup.
  - id: SEC-XSS-0013
