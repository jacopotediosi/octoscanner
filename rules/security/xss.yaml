          (?= (?> (?&str) | \{ [^{}]* \} | [^{}] )*? (?<! [-\w$] ) ['"]? html ['"]? \s* : \s* true \b )
          (?> (?&str) | \{ [^{}]* \} | [^{}] )*? (?<! [-\w$] ) ['"]? title ['"]? \s* : \s*
          (?<VALUE> (?> (?&str) | (?&paren) | (?&brack) | [^,{}] )+ )
          (?> (?&str) | \{ [^{}]* \} | [^{}] )*? \}
          (?(DEFINE)
            # Kept single-line, so that they cannot swallow the object's closing brace
            (?<str>   " (?: [^"\\\n] | \\. )* " | ' (?: [^'\\\n] | \\. )* ' )
            (?<paren> \( (?: [^()"'] | (?&str) | (?&paren) )* \) )
            (?<brack> \[ (?: [^\[\]"'] | (?&str) | (?&brack) )* \] )
