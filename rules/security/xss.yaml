# OctoPrint XSS security rules

# Shared by every XSS rule below. Matches the values that are provably safe.
_safe_expression: &safe_expression |-
  (?x)
  \A \s* (?&expr) \s* \z
  (?(DEFINE)
    # A safe expression: safe atoms joined by `+`
    (?<expr>       (?&atom) (?: \s* \+ \s* (?&atom) )* )
    (?<atom>       (?&str) | (?&escaper) | (?&translator) | (?&formatter) | (?&array)
                 | \( \s* (?&expr) \s* \) )
    # String literals. Semgrep truncates a template literal right after its first
    # interpolation, hence the optional trailing `}` and backtick.
    (?<str>        " (?: [^"\\] | \\. )* "
                 | ' (?: [^'\\] | \\. )* '
                 | ` (?: [^`\\$] | \\. | \$ (?!\{) | \$\{ \s* (?&expr) \s* \}? )* `? )
    # Escaping/sanitizing calls, safe whatever their arguments are
    (?<escaper>    (?: [\w$]+ \s* \. \s* )* (?: escape | sanitize ) \w* \s* (?&args) )
    # Translation calls, safe only as long as their arguments are safe too
    (?<translator> (?: [\w$]+ \s* \. \s* )* (?: n?gettext | _ ) \s*
                   \( \s* (?&expr) (?: \s* , \s* (?: (?&expr) | [\w$.]+ ) )* \s* ,? \s* \) )
    # `sprintf` calls, safe as long as the format and every substituted value are
    (?<formatter>  (?: [\w$]+ \s* \. \s* )* v?sprintf \s* \(
                   \s* (?&expr) (?: \s* , \s* (?&farg) )* \s* ,? \s* \) )
    (?<farg>       (?&expr) | (?&obj) )
    (?<obj>        \{ \s* (?: (?&pair) (?: \s* , \s* (?&pair) )* \s* ,? )? \s* \} )
    (?<pair>       (?: [\w$]+ | (?&str) ) \s* : \s* (?&farg) )
    # Arrays whose items are all safe expressions
    (?<array>      \[ \s* (?: (?&expr) (?: \s* , \s* (?&expr) )* \s* ,? )? \s* \] )
    # Balanced parentheses, any depth, with strings left alone
    (?<args>       \( (?: [^()"'`] | (?&str) | (?&args) )* \) )
  )

rules:
  - id: SEC-XSS-0001
    message: >
      Plugin implements `TemplatePlugin` but does not override
      `is_template_autoescaped()`. Until OctoPrint 2.1.0, the default
      implementation returns `False`, exposing the templates to XSS via
      unescaped variables.
    languages: [python]
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: |
              class $CLASS(..., octoprint.plugin.TemplatePlugin, ...):
                  ...
          - pattern: |
              class $CLASS(..., TemplatePlugin, ...):
                  ...
      - pattern-not: |
          class $CLASS(...):
              ...
              def is_template_autoescaped(self, ...):
                  ...
              ...
    metadata:
      type: security
      since: 1.11.0
      suggestion: >
        Override `is_template_autoescaped()` to return `True` and use the `safe`
        Jinja filter only for variables that legitimately need to render HTML.
        See https://faq.octoprint.org/plugin-autoescape.
  - id: SEC-XSS-0002
    message: >
      Plugin implements `is_template_autoescaped()` but explicitly returns
      `False`, exposing the templates to XSS via unescaped variables.
    languages: [python]
    severity: CRITICAL
    patterns:
      - pattern-either:
          - pattern: |
              class $CLASS(..., octoprint.plugin.TemplatePlugin, ...):
                  ...
                  def is_template_autoescaped(self, ...):
                      ...
                      return False
                  ...
          - pattern: |
              class $CLASS(..., TemplatePlugin, ...):
                  ...
                  def is_template_autoescaped(self, ...):
                      ...
                      return False
                  ...
    metadata:
      type: security
      since: 1.11.0
      suggestion: >
        Return `True` and use the `safe` Jinja filter only for variables that
        legitimately need to render HTML. See https://faq.octoprint.org/plugin-autoescape.
  - id: SEC-XSS-0003
    message: >
      Knockout `html:` binding bound to a non-literal value in a Jinja/HTML
      template. The bound expression is rendered as raw HTML, so any
      attacker-controllable data flowing into it results in DOM XSS.
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "*.jinja2"
        - "*.html"
    patterns:
      # Match the `data-bind` attribute down to the value of its top-level `html:`
      # binding, and capture that value so that the `metavariable-pattern` below can
      # inspect it on its own.
      - pattern-regex: |-
          (?x)
          # Atomic skips: a quoted string consumed one character at a time blows up the scan.
          data-bind \s* = \s* (?<Q> ["'] )
          (?> (?! \k<Q> ) (?: (?&str) | (?&group) | [\s\S] ) )*?
          (?<! [-\w$.] ) html \s* : \s*
          (?<VALUE> (?> (?! \k<Q> ) (?: (?&str) | (?&group) | [^,] ) )+ )
          (?(DEFINE)
            # Kept single-line, so that they cannot swallow the closing quote
            (?<str>    ' (?: [^'\\\n] | \\. )* ' | " (?: [^"\\\n] | \\. )* " )
            # Anything that neither opens a group nor starts a string
            (?<plain>  [^{}\[\]()'"] )
            # Bracketed groups, unrolled to four levels: unbounded recursion lets a run
            # of stray braces exhaust the PCRE limits and void the whole file silently.
            (?<group>  [{\[(] (?: (?&plain) | (?&str) | (?&group2) )* [)\]}] )
            (?<group2> [{\[(] (?: (?&plain) | (?&str) | (?&group3) )* [)\]}] )
            (?<group3> [{\[(] (?: (?&plain) | (?&str) | (?&group4) )* [)\]}] )
            (?<group4> [{\[(] (?: (?&plain) | (?&str) )* [)\]}] )
          )
      - metavariable-pattern:
          metavariable: $VALUE
          language: generic
          patterns:
            # Exclude expressions made exclusively of safe atoms: string literals,
            # escaping/sanitizing calls, translation calls whose own arguments are
            # safe, and arrays of those. Anything else (bare identifier, property
            # access, observable, unknown call, ...) trips it.
            - pattern-not-regex: *safe_expression
            # Exclude the Bootstrap popover `html` sub-option, for the rare attribute
            # whose nesting runs deeper than the skip above can follow.
            - pattern-not-regex: '\A\s*(true|false)\s*\z'
            # Exclude values that route through an escaping/sanitizing call even when
            # its result is wrapped further, e.g. `highlight(escape(key))`.
            - pattern-not-regex: '\b(escape|sanitize)\w*\s*\('
    metadata:
      type: security
      suggestion: >
        Prefer the Knockout `text:` binding, which renders the value as plain
        text and is safe by default. Use `html:` only when raw HTML output is
        strictly required, and only with values that are either fully static
        or that have been properly sanitized.
  - id: SEC-XSS-0004
    message: >
      `PNotify` invocation passing a non-literal value as `text` without
      `text_escape: true`. PNotify v2 (the version shipped with OctoPrint)
      renders `text` as raw HTML by default, so any attacker-controllable data
      flowing into it (push messages, backend errors, printer responses, etc.)
      results in DOM XSS.
    languages: [js]
    severity: WARNING
    patterns:
      - pattern: "new PNotify({..., text: $X, ...})"
      - pattern-not: "new PNotify({..., text_escape: true, ...})"
      - metavariable-pattern:
          metavariable: $X
          patterns:
            # Exclude string literals, taking advantage of Semgrep's AST
            # constant propagation.
            - pattern-not: '"..."'
            - pattern-not: "'...'"
            # Exclude expressions made exclusively of safe atoms: string
            # literals, escaping/sanitizing calls, translation calls whose own
            # arguments are safe, and arrays of those. Anything else (bare
            # identifier, property access, unknown call, translated
            # concatenation, template literal interpolating an unescaped
            # value, ...) trips it.
            - pattern-not-regex: *safe_expression
    metadata:
      type: security
      suggestion: >
        Set `text_escape: true` in the PNotify options so the value is rendered
        as plain text. If the value must contain HTML, escape any
        user-controllable substring via `_.escape(...)` before
        interpolating it into the markup.
  - id: SEC-XSS-0005
    message: >
      `PNotify` invocation passing a non-literal value as `title` without
