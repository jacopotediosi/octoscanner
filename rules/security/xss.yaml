  - id: SEC-XSS-0014
    message: >
      Bootstrap `popover()` initialization enabling `html` and passing a non-literal
      value as `content`. Bootstrap fills the popover body with `.html()` instead of
      `.text()` as soon as `html` is on, so any attacker-controllable data flowing
      into `content` results in DOM XSS.
    languages: [js]
    severity: WARNING
    patterns:
      - pattern: "$EL.popover({..., html: true, ...})"
      - pattern-either:
          - patterns:
              - pattern: "$EL.popover({..., content: $X, ...})"
              - metavariable-pattern:
                  metavariable: $X
                  patterns:
                    # Exclude string literals, taking advantage of Semgrep's AST
                    # constant propagation.
                    - pattern-not: '"..."'
                    - pattern-not: "'...'"
                    # Exclude expressions made exclusively of safe atoms: string
                    # literals, escaping/sanitizing calls, translation calls whose
                    # own arguments are safe, and arrays of those. Anything else
                    # (bare identifier, property access, unknown call, translated
                    # concatenation, template literal interpolating an unescaped
                    # value, ...) trips it.
                    - pattern-not-regex: *safe_expression
          # Bootstrap invokes a function-valued `content` to build the body, so it is
          # dynamic by construction. A metavariable never binds a function
          # expression, hence the dedicated alternatives.
          - pattern: "$EL.popover({..., content: function(...) {...}, ...})"
          - pattern: "$EL.popover({..., content: (...) => ..., ...})"
    metadata:
      type: security
      suggestion: >
        Drop `html: true` so Bootstrap renders the popover body as plain text. If the
        body must contain markup, escape every user-controllable substring via
        `_.escape(...)` before interpolating it into the markup.
  - id: SEC-XSS-0015
    message: >
      Bootstrap `popover()` initialization enabling `html` and passing a non-literal
      value as `title`. Bootstrap fills the popover header with `.html()` instead of
      `.text()` as soon as `html` is on, so any attacker-controllable data flowing
      into `title` results in DOM XSS.
    languages: [js]
    severity: WARNING
    patterns:
      - pattern: "$EL.popover({..., html: true, ...})"
      - pattern-either:
          - patterns:
              - pattern: "$EL.popover({..., title: $X, ...})"
              - metavariable-pattern:
                  metavariable: $X
                  patterns:
                    # Exclude string literals, taking advantage of Semgrep's AST
                    # constant propagation.
                    - pattern-not: '"..."'
                    - pattern-not: "'...'"
                    # Exclude expressions made exclusively of safe atoms: string
                    # literals, escaping/sanitizing calls, translation calls whose
                    # own arguments are safe, and arrays of those. Anything else
                    # (bare identifier, property access, unknown call, translated
                    # concatenation, template literal interpolating an unescaped
                    # value, ...) trips it.
                    - pattern-not-regex: *safe_expression
          # Bootstrap invokes a function-valued `title` to build the header, so it is
          # dynamic by construction. A metavariable never binds a function
          # expression, hence the dedicated alternatives.
          - pattern: "$EL.popover({..., title: function(...) {...}, ...})"
          - pattern: "$EL.popover({..., title: (...) => ..., ...})"
    metadata:
      type: security
      suggestion: >
        Drop `html: true` so Bootstrap renders the popover header as plain text. If
        the header must contain markup, escape every user-controllable substring via
        `_.escape(...)` before interpolating it into the markup.
